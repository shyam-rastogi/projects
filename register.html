<main>
<h1>Create your account</h1>
<form class="box" action="#" method="post">
<label for="name">Full name</label><input id="name" name="name" required>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="roll">Roll number</label><input id="roll" name="roll" required>
<label for="course">Course</label>
<select id="course" name="course"><option>B.Tech CSIT</option><option>B.Tech CSE</option><option>Other</option></select>
<label for="pw">Password</label><input id="pw" name="password" type="password" minlength="8" required>
<p><button class="btn" type="submit">Register</button></p>
<p>Already registered? <a href="login.html">Log in</a></p>
</form>
</main>
